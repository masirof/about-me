<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <title>Camera Monitor UI</title>
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <style>
      :root {
        --bg: #1f1f1f;
        --grid: rgba(255, 255, 255, 0.06);
        --ink: #f2f2f2;
        --muted: #b3b3b3;
        --line: rgba(255, 255, 255, 0.2);
        --accent: #d6d6d6;
        --glow: rgba(255, 255, 255, 0.2);
        --unit: 512px;
        --unit-pad: 16px;
        --unit-gap: 24px;
      }
      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }
      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        font-family: "Trebuchet MS", "Lucida Sans Unicode", sans-serif;
        background: var(--bg);
        color: var(--ink);
        overflow: hidden;
      }
      .frame {
        width: 100%;
        height: 100%;
        max-width: none;
        margin: 0;
        padding: 40px 48px 56px;
        position: relative;
        background:
          linear-gradient(0deg, var(--grid) 1px, transparent 1px),
          linear-gradient(90deg, var(--grid) 1px, transparent 1px),
          var(--bg);
        background-size: 60px 60px, 60px 60px, auto;
        border: 1px solid rgba(255, 255, 255, 0.18);
        box-shadow:
          0 0 40px rgba(0, 0, 0, 0.6),
          inset 0 0 40px rgba(255, 255, 255, 0.04),
          inset 0 0 120px rgba(0, 0, 0, 0.5);
        overflow: hidden;
      }
      .frame::before,
      .frame::after {
        content: "";
        position: absolute;
        inset: 8px;
        pointer-events: none;
      }
      .frame::before {
        border: 1px solid rgba(255, 255, 255, 0.12);
        box-shadow: inset 0 0 16px rgba(255, 255, 255, 0.08);
      }
      .frame::after {
        background:
          linear-gradient(90deg, rgba(255, 255, 255, 0.4), transparent 40%) top left / 120px 2px no-repeat,
          linear-gradient(180deg, rgba(255, 255, 255, 0.4), transparent 40%) top left / 2px 120px no-repeat,
          linear-gradient(90deg, rgba(255, 255, 255, 0.3), transparent 40%) bottom right / 120px 2px no-repeat,
          linear-gradient(180deg, rgba(255, 255, 255, 0.3), transparent 40%) bottom right / 2px 120px no-repeat;
      }
      .scanline {
        position: absolute;
        inset: 0;
        background:
          linear-gradient(180deg, rgba(255, 255, 255, 0.04) 1px, transparent 1px),
          linear-gradient(180deg, transparent, rgba(255, 255, 255, 0.05) 50%, transparent);
        background-size: 100% 6px, 100% 160px;
        opacity: 0.18;
        pointer-events: none;
        mix-blend-mode: screen;
      }
      .viewport {
        transform-origin: 0 0;
        will-change: transform;
        display: inline-block;
      }
      h1 {
        font-size: 48px;
        margin: 0 0 10px;
        letter-spacing: 0.5em;
        text-transform: uppercase;
        line-height: 1.05;
        text-shadow: 0 0 12px rgba(255, 255, 255, 0.2);
      }
      .sub {
        font-size: 33px;
        color: var(--muted);
        letter-spacing: 0.28em;
        margin-bottom: 24px;
        text-transform: uppercase;
        line-height: 1.2;
        text-shadow: 0 0 10px rgba(255, 255, 255, 0.15);
      }
      .rail {
        height: 3px;
        background: linear-gradient(90deg, transparent, var(--line), var(--accent), var(--line), transparent);
        margin: 20px 0 28px;
        box-shadow: 0 0 12px rgba(255, 255, 255, 0.12);
      }
      .rig {
        display: grid;
        grid-template-columns: repeat(5, calc(var(--unit) + var(--unit-pad) * 2));
        gap: var(--unit-gap);
        justify-content: center;
        align-items: start;
      }
      .unit {
        position: relative;
        border: 1px solid rgba(255, 255, 255, 0.2);
        padding: var(--unit-pad);
        background:
          linear-gradient(180deg, rgba(28, 28, 28, 0.95), rgba(22, 22, 22, 0.95));
        box-shadow:
          inset 0 0 0 1px rgba(255, 255, 255, 0.08),
          0 0 22px rgba(0, 0, 0, 0.35);
      }
      .unit::before {
        content: "";
        position: absolute;
        inset: 6px;
        border: 1px solid rgba(255, 255, 255, 0.12);
        pointer-events: none;
      }
      .unit-header {
        font-size: 40px;
        letter-spacing: 0.28em;
        text-transform: uppercase;
        color: rgba(255, 255, 255, 0.85);
        margin-bottom: 16px;
      }
      .image-box {
        width: var(--unit);
        height: var(--unit);
        position: relative;
        display: grid;
        place-items: center;
        border: 1px solid rgba(255, 255, 255, 0.2);
        background:
          linear-gradient(135deg, rgba(20, 20, 20, 0.95), rgba(14, 14, 14, 0.95));
        margin-bottom: 24px;
        overflow: hidden;
        box-shadow:
          inset 0 0 24px rgba(255, 255, 255, 0.06),
          0 0 16px rgba(0, 0, 0, 0.35);
      }
      .image-box::after {
        content: "";
        position: absolute;
        inset: 0;
        background:
          linear-gradient(0deg, rgba(255, 255, 255, 0.05) 1px, transparent 1px),
          linear-gradient(90deg, rgba(255, 255, 255, 0.04) 1px, transparent 1px);
        background-size: 26px 26px;
        opacity: 0.18;
        pointer-events: none;
      }
      .image-box img {
        max-width: 100%;
        max-height: 100%;
        object-fit: contain;
        display: block;
        transform-origin: center top;
      }
      /* .image-box img.cb1 {
        transform: translateY(-15%);
      }
      .image-box img.cl1 {
        transform: translateY(-20%) scale(0.7);
      }
      .image-box img.cl2 {
        transform: translateY(-20%) scale(0.7);
      }
      .image-box img.cl3 {
        transform: scale(0.5);
      }
      .image-box img.cl4 {
        transform: translateY(-40%) scale(0.9);
      } */
      .unit-title {
        font-size: 42px;
        letter-spacing: 0.08em;
        line-height: 1.2;
        text-shadow: 0 0 14px rgba(255, 255, 255, 0.12);
      }
      .specs {
        font-size: 36px;
        color: var(--muted);
        line-height: 1.5;
        margin-top: 12px;
      }
      .info-block {
        height: 180px;
        display: flex;
        flex-direction: column;
        justify-content: flex-start;
        margin-bottom: 10px;
        overflow: hidden;
      }
      .info-block {
        position: relative;
        z-index: 1;
      }
      .stat-row {
        display: grid;
        grid-template-columns: 160px 120px var(--stat-bar-width);
        align-items: center;
        gap: 18px;
        margin: 0;
      }
      .stat-wrap {
        --stat-bar-width: 180px;
      }
      .stat-wrap {
        display: flex;
        flex-direction: column;
        /* min-height: 200px; */
        gap: 10px;
      }
      .stat-wrap.cb1 {
        justify-content: flex-end;
        min-height: 115px;
      }
      .rig > .unit:nth-child(1) .stat-wrap {
        min-height: 110px;
      }
      .stat-block {
        display: flex;
        flex-direction: column;
        gap: 0;
      }
      .stat-label {
        font-size: 26px;
        letter-spacing: 0.22em;
        color: rgba(255, 255, 255, 0.8);
        text-transform: uppercase;
      }
      .stat-inline {
        font-size: 24px;
        letter-spacing: 0.12em;
        color: var(--muted);
        white-space: nowrap;
      }
      .stat-bar {
        position: relative;
        width: var(--stat-bar-width);
        height: 18px;
        border: none;
        background: #545454;
        overflow: hidden;
        box-shadow: inset 0 0 12px rgba(0, 0, 0, 0.5);
      }
      .stat-bar::after {
        content: "";
        position: absolute;
        inset: 0;
        background:
          linear-gradient(0deg, rgba(255, 255, 255, 0.08) 1px, transparent 1px),
          linear-gradient(90deg, rgba(255, 255, 255, 0.06) 1px, transparent 1px);
        background-size: 18px 18px;
        opacity: 0.35;
        pointer-events: none;
      }
      .stat-fill {
        height: 100%;
        width: 40%;
        background: #969696;
        box-shadow:
          0 0 12px rgba(0, 0, 0, 0.4),
          inset 0 0 10px rgba(255, 255, 255, 0.1);
      }
      .controls {
        display: none;
        gap: 10px;
        align-items: center;
        margin-bottom: 12px;
        font-size: 33px;
        color: var(--muted);
        text-shadow: 0 0 10px rgba(90, 200, 255, 0.2);
      }
      .controls button {
        background: transparent;
        border: 1px solid rgba(120, 190, 255, 0.35);
        color: var(--ink);
        padding: 8px 14px;
        font-size: 33px;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        cursor: pointer;
        box-shadow: 0 0 12px rgba(90, 200, 255, 0.2);
      }
      .controls button:hover {
        border-color: rgba(120, 190, 255, 0.6);
      }
      .hidden {
        display: none;
      }
      .empty {
        font-size: 36px;
        color: var(--muted);
        padding: 16px 0;
      }
      @media (max-width: 1200px) {
        .rig {
          grid-template-columns: repeat(2, calc(var(--unit) + var(--unit-pad) * 2));
          justify-content: center;
        }
      }
    </style>
  </head>
  <body>
    <div class="frame" id="frame">
      <div class="scanline"></div>
      <div class="viewport" id="viewport">
        <h1>Camera Monitor</h1>
        <div class="sub">CAMERA + LENS STACK / WIDE VIEW</div>
        <div class="controls" id="controls">
          <span>CSV load failed. Select file manually.</span>
          <button id="loadCsv">Load CSV</button>
          <input id="csvFile" type="file" accept=".csv" class="hidden" />
        </div>
        <div class="rail"></div>
        <div id="rig" class="rig"></div>
      </div>
    </div>
    <script>
      const order = ["cb1", "cl1", "cl2", "cl3", "cl4"];
      const frame = d3.select("#frame");
      const viewport = d3.select("#viewport");
      const controls = document.getElementById("controls");
      const loadCsvButton = document.getElementById("loadCsv");
      const csvFileInput = document.getElementById("csvFile");
      const rig = d3.select("#rig");

      function normalizeRows(rows) {
        return rows.map((row) => {
          const cleaned = {};
          Object.keys(row).forEach((key) => {
            const trimmedKey = key.trim();
            const value = typeof row[key] === "string" ? row[key].trim() : row[key];
            cleaned[trimmedKey] = value;
          });
          return cleaned;
        });
      }

      function imageKey(name) {
        const match = (name || "").toLowerCase().match(/^(cb\d+|cl\d+)\./);
        return match ? match[1] : "";
      }

      function render(rows) {
        rig.selectAll("*").remove();
        const cleaned = normalizeRows(rows);
        const mapped = order.map((key) => cleaned.find((row) => imageKey(row.image) === key)).filter(Boolean);

        if (!mapped.length) {
          rig.append("div").attr("class", "empty").text("Failed to load camera_ui.csv.");
          return;
        }

        const units = rig.selectAll(".unit")
          .data(mapped)
          .enter()
          .append("div")
          .attr("class", "unit");

        units.append("div")
          .attr("class", "unit-header")
          .text((d) => imageKey(d.image).toUpperCase());

        const imageBox = units.append("div").attr("class", "image-box");
        imageBox.append("img")
          .attr("alt", (d) => d.name || "")
          .attr("src", (d) => `images/original/${d.image}`)
          .attr("class", (d) => imageKey(d.image))
          .on("load", () => {
            fitToFrame();
          });

        const info = units.append("div").attr("class", "info-block");
        info.append("div")
          .attr("class", "unit-title")
          .text((d) => d.name || "");

        const specs = info.append("div").attr("class", "specs");
        specs.append("span").text((d) => d.sensor ? `SENSOR: ${d.sensor}` : "");

        const statWrap = units.append("div")
          .attr("class", (d) => `stat-wrap ${imageKey(d.image)}`);
        const hideForBody = (d) => imageKey(d.image) !== "cb1";
        addStat(statWrap, "FOCAL", (d) => d.focal_length, (value) => statValue(value, "focal"), hideForBody);
        addStat(statWrap, "APERTURE", (d) => d.aperture, (value) => statValue(value, "aperture"), hideForBody);
        addStat(statWrap, "WEIGHT", (d) => d.weight, (value) => statValue(value, "weight"));

        fitToFrame();
      }


      function addStat(container, label, valueFn, percentFn, predicate) {
        const block = container.append("div").attr("class", "stat-block");
        const row = block.append("div").attr("class", "stat-row");
        if (predicate) {
          block.style("display", (d) => predicate(d) ? null : "none");
        }
        row.append("div").attr("class", "stat-label").text(label);
        row.append("div").attr("class", "stat-inline").text((d) => valueFn(d) || "-");
        const bar = row.append("div").attr("class", "stat-bar");
        bar.append("div")
          .attr("class", "stat-fill")
          .style("width", (d) => `${percentFn(valueFn(d))}%`);
      }

      function statValue(value, kind) {
        if (!value) return 25;
        const numbers = (value.match(/\d+\.?\d*/g) || []).map(Number);
        if (!numbers.length) return 25;
        const max = Math.max(...numbers);
        if (kind === "focal") {
          return Math.max(10, Math.min(100, (max / 200) * 100));
        }
        if (kind === "aperture") {
          const inverted = 1 / Math.max(0.7, max);
          return Math.max(10, Math.min(100, inverted * 120));
        }
        if (kind === "weight") {
          return Math.max(10, Math.min(100, (max / 1000) * 100));
        }
        return 40;
      }
      function handleCsvFile(file) {
        if (!file) return;
        const reader = new FileReader();
        reader.onload = () => {
          const text = reader.result;
          const rows = d3.csvParse(text);
          render(rows);
        };
        reader.readAsText(file);
      }

      loadCsvButton.addEventListener("click", () => csvFileInput.click());
      csvFileInput.addEventListener("change", (event) => {
        handleCsvFile(event.target.files[0]);
      });

      d3.csv("camera_ui.csv").then((rows) => {
        render(rows);
      }).catch(() => {
        controls.style.display = "flex";
      });

      const zoom = d3.zoom()
        .scaleExtent([0.01, 3])
        .on("zoom", (event) => {
          viewport.style("transform", `translate(${event.transform.x}px, ${event.transform.y}px) scale(${event.transform.k})`);
        });

      function fitToFrame() {
        viewport.style("transform", "translate(0px, 0px) scale(1)");
        const frameNode = frame.node();
        const frameWidth = frameNode.clientWidth;
        const frameHeight = frameNode.clientHeight;
        const frameStyle = window.getComputedStyle(frameNode);
        const paddingLeft = parseFloat(frameStyle.paddingLeft) || 0;
        const paddingRight = parseFloat(frameStyle.paddingRight) || 0;
        const paddingTop = parseFloat(frameStyle.paddingTop) || 0;
        const paddingBottom = parseFloat(frameStyle.paddingBottom) || 0;
        const innerWidth = frameWidth - paddingLeft - paddingRight;
        const innerHeight = frameHeight - paddingTop - paddingBottom;
        const rigNode = rig.node();
        const viewportNode = viewport.node();
        const rect = viewportNode.getBoundingClientRect();
        const contentWidth = Math.max(
          rect.width,
          rigNode.scrollWidth,
          viewportNode.scrollWidth,
          viewportNode.offsetWidth
        );
        const contentHeight = Math.max(
          rect.height,
          viewportNode.scrollHeight,
          viewportNode.offsetHeight
        );
        if (!frameWidth || !frameHeight || !contentWidth || !contentHeight || innerWidth <= 0 || innerHeight <= 0) return;
        const scale = Math.min(1, innerWidth / contentWidth, innerHeight / contentHeight);
        const tx = paddingLeft + Math.max(0, (innerWidth - contentWidth * scale) / 2);
        const ty = paddingTop + Math.max(0, (innerHeight - contentHeight * scale) / 2);
        frame.call(zoom.transform, d3.zoomIdentity.translate(tx, ty).scale(scale));
      }

      frame.call(zoom);
      if (document.fonts && document.fonts.ready) {
        document.fonts.ready.then(() => {
          fitToFrame();
        });
      }
      const resizeObserver = new ResizeObserver(() => {
        fitToFrame();
      });
      resizeObserver.observe(viewport.node());
      window.addEventListener("resize", fitToFrame);
      window.addEventListener("load", fitToFrame);
    </script>
  </body>
</html>
