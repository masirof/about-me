<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <title>Camera Monitor UI</title>
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <style>
      :root {
        --bg: #06080d;
        --grid: rgba(90, 200, 255, 0.08);
        --ink: #d8f6ff;
        --muted: #7da6c2;
        --line: rgba(90, 200, 255, 0.35);
        --accent: #7cf0ff;
        --glow: rgba(90, 200, 255, 0.4);
        --unit: 512px;
        --unit-pad: 16px;
        --unit-gap: 24px;
      }
      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        font-family: "Trebuchet MS", "Lucida Sans Unicode", sans-serif;
        background:
          radial-gradient(circle at 15% 10%, rgba(70, 180, 255, 0.08), transparent 35%),
          radial-gradient(circle at 80% 20%, rgba(120, 255, 230, 0.06), transparent 40%),
          radial-gradient(circle at 50% 80%, rgba(120, 160, 255, 0.05), transparent 45%),
          var(--bg);
        color: var(--ink);
      }
      .frame {
        max-width: 2800px;
        margin: 12px auto 0;
        padding: 24px 24px 32px;
        position: relative;
        background:
          linear-gradient(0deg, rgba(125, 230, 255, 0.06) 1px, transparent 1px),
          linear-gradient(90deg, rgba(125, 230, 255, 0.06) 1px, transparent 1px),
          linear-gradient(180deg, rgba(10, 18, 26, 0.92), rgba(6, 10, 16, 0.98)),
          var(--bg);
        background-size: 60px 60px, 60px 60px, auto;
        border: 1px solid rgba(90, 200, 255, 0.28);
        box-shadow:
          0 0 40px rgba(0, 0, 0, 0.6),
          inset 0 0 40px rgba(20, 80, 120, 0.2),
          inset 0 0 120px rgba(10, 20, 30, 0.8);
        overflow: hidden;
      }
      .frame::before,
      .frame::after {
        content: "";
        position: absolute;
        inset: 8px;
        pointer-events: none;
      }
      .frame::before {
        border: 1px solid rgba(90, 200, 255, 0.16);
        box-shadow: inset 0 0 16px rgba(90, 200, 255, 0.12);
      }
      .frame::after {
        background:
          linear-gradient(90deg, rgba(124, 240, 255, 0.5), transparent 40%) top left / 120px 2px no-repeat,
          linear-gradient(180deg, rgba(124, 240, 255, 0.5), transparent 40%) top left / 2px 120px no-repeat,
          linear-gradient(90deg, rgba(124, 240, 255, 0.4), transparent 40%) bottom right / 120px 2px no-repeat,
          linear-gradient(180deg, rgba(124, 240, 255, 0.4), transparent 40%) bottom right / 2px 120px no-repeat;
      }
      .scanline {
        position: absolute;
        inset: 0;
        background:
          linear-gradient(180deg, rgba(255, 255, 255, 0.05) 1px, transparent 1px),
          linear-gradient(180deg, transparent, rgba(20, 60, 90, 0.2) 50%, transparent);
        background-size: 100% 6px, 100% 160px;
        opacity: 0.18;
        pointer-events: none;
        mix-blend-mode: screen;
      }
      .viewport {
        transform-origin: 0 0;
        will-change: transform;
        display: inline-block;
      }
      h1 {
        font-size: 48px;
        margin: 0 0 6px;
        letter-spacing: 0.32em;
        text-transform: uppercase;
        text-shadow: 0 0 12px rgba(124, 240, 255, 0.45);
      }
      .sub {
        font-size: 33px;
        color: var(--muted);
        letter-spacing: 0.16em;
        margin-bottom: 14px;
        text-shadow: 0 0 10px rgba(90, 200, 255, 0.2);
      }
      .rail {
        height: 3px;
        background: linear-gradient(90deg, transparent, var(--line), var(--accent), var(--line), transparent);
        margin: 10px 0 16px;
        box-shadow: 0 0 12px rgba(124, 240, 255, 0.35);
      }
      .rig {
        display: grid;
        grid-template-columns: repeat(5, calc(var(--unit) + var(--unit-pad) * 2));
        gap: var(--unit-gap);
        justify-content: center;
      }
      .unit {
        position: relative;
        border: 1px solid rgba(120, 210, 255, 0.3);
        padding: var(--unit-pad);
        background:
          linear-gradient(180deg, rgba(10, 22, 32, 0.9), rgba(7, 12, 18, 0.85));
        box-shadow:
          inset 0 0 0 1px rgba(80, 150, 210, 0.15),
          0 0 18px rgba(20, 60, 90, 0.35);
      }
      .unit::before {
        content: "";
        position: absolute;
        inset: 6px;
        border: 1px solid rgba(80, 150, 210, 0.2);
        pointer-events: none;
      }
      .unit-header {
        font-size: 36px;
        letter-spacing: 0.2em;
        text-transform: uppercase;
        color: rgba(140, 220, 255, 0.9);
        margin-bottom: 8px;
      }
      .image-box {
        width: var(--unit);
        height: var(--unit);
        position: relative;
        display: grid;
        place-items: center;
        border: 1px solid rgba(120, 210, 255, 0.35);
        background:
          linear-gradient(135deg, rgba(10, 16, 26, 0.9), rgba(6, 10, 16, 0.95));
        margin-bottom: 16px;
        overflow: hidden;
        box-shadow:
          inset 0 0 24px rgba(20, 80, 120, 0.35),
          0 0 16px rgba(30, 90, 140, 0.35);
      }
      .image-box::after {
        content: "";
        position: absolute;
        inset: 0;
        background:
          linear-gradient(0deg, rgba(124, 240, 255, 0.08) 1px, transparent 1px),
          linear-gradient(90deg, rgba(124, 240, 255, 0.06) 1px, transparent 1px);
        background-size: 26px 26px;
        opacity: 0.18;
        pointer-events: none;
      }
      .image-box img {
        max-width: 100%;
        max-height: 100%;
        object-fit: contain;
        display: block;
        transform-origin: center top;
      }
      /* .image-box img.cb1 {
        transform: translateY(-15%);
      }
      .image-box img.cl1 {
        transform: translateY(-20%) scale(0.7);
      }
      .image-box img.cl2 {
        transform: translateY(-20%) scale(0.7);
      }
      .image-box img.cl3 {
        transform: scale(0.5);
      }
      .image-box img.cl4 {
        transform: translateY(-40%) scale(0.9);
      } */
      .unit-title {
        font-size: 42px;
        letter-spacing: 0.08em;
        margin-bottom: 10px;
        text-shadow: 0 0 14px rgba(124, 240, 255, 0.2);
      }
      .specs {
        font-size: 36px;
        color: var(--muted);
        line-height: 1.5;
      }
      .specs span {
        display: block;
      }
      .controls {
        display: none;
        gap: 10px;
        align-items: center;
        margin-bottom: 12px;
        font-size: 33px;
        color: var(--muted);
        text-shadow: 0 0 10px rgba(90, 200, 255, 0.2);
      }
      .controls button {
        background: transparent;
        border: 1px solid rgba(120, 190, 255, 0.35);
        color: var(--ink);
        padding: 8px 14px;
        font-size: 33px;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        cursor: pointer;
        box-shadow: 0 0 12px rgba(90, 200, 255, 0.2);
      }
      .controls button:hover {
        border-color: rgba(120, 190, 255, 0.6);
      }
      .hidden {
        display: none;
      }
      .empty {
        font-size: 36px;
        color: var(--muted);
        padding: 16px 0;
      }
      @media (max-width: 1200px) {
        .rig {
          grid-template-columns: repeat(2, calc(var(--unit) + var(--unit-pad) * 2));
          justify-content: center;
        }
      }
    </style>
  </head>
  <body>
    <div class="frame" id="frame">
      <div class="scanline"></div>
      <div class="viewport" id="viewport">
        <h1>Camera Monitor</h1>
        <div class="sub">CAMERA + LENS STACK / WIDE VIEW</div>
        <div class="controls" id="controls">
          <span>CSV読み込み失敗時は手動で選択</span>
          <button id="loadCsv">Load CSV</button>
          <input id="csvFile" type="file" accept=".csv" class="hidden" />
        </div>
        <div class="rail"></div>
        <div id="rig" class="rig"></div>
      </div>
    </div>
    <script>
      const order = ["cb1", "cl1", "cl2", "cl3", "cl4"];
      const frame = d3.select("#frame");
      const viewport = d3.select("#viewport");
      const controls = document.getElementById("controls");
      const loadCsvButton = document.getElementById("loadCsv");
      const csvFileInput = document.getElementById("csvFile");
      const rig = d3.select("#rig");

      function normalizeRows(rows) {
        return rows.map((row) => {
          const cleaned = {};
          Object.keys(row).forEach((key) => {
            const trimmedKey = key.trim();
            const value = typeof row[key] === "string" ? row[key].trim() : row[key];
            cleaned[trimmedKey] = value;
          });
          return cleaned;
        });
      }

      function imageKey(name) {
        const match = (name || "").toLowerCase().match(/^(cb\d+|cl\d+)\./);
        return match ? match[1] : "";
      }

      function render(rows) {
        rig.selectAll("*").remove();
        const cleaned = normalizeRows(rows);
        const mapped = order.map((key) => cleaned.find((row) => imageKey(row.image) === key)).filter(Boolean);

        if (!mapped.length) {
          rig.append("div").attr("class", "empty").text("camera_ui.csv からデータを読み込めませんでした。");
          return;
        }

        const units = rig.selectAll(".unit")
          .data(mapped)
          .enter()
          .append("div")
          .attr("class", "unit");

        units.append("div")
          .attr("class", "unit-header")
          .text((d) => imageKey(d.image).toUpperCase());

        const imageBox = units.append("div").attr("class", "image-box");
        imageBox.append("img")
          .attr("alt", (d) => d.name || "")
          .attr("src", (d) => `images/original/${d.image}`)
          .attr("class", (d) => imageKey(d.image));

        units.append("div")
          .attr("class", "unit-title")
          .text((d) => d.name || "");

        const specs = units.append("div").attr("class", "specs");
        specs.append("span").text((d) => d.sensor ? `SENSOR: ${d.sensor}` : "");
        specs.append("span").text((d) => d.focal_length ? `FOCAL: ${d.focal_length}` : "");
        specs.append("span").text((d) => d.aperture ? `APERTURE: ${d.aperture}` : "");
        specs.append("span").text((d) => d.weight ? `WEIGHT: ${d.weight}` : "");

        fitToFrame();
      }

      function handleCsvFile(file) {
        if (!file) return;
        const reader = new FileReader();
        reader.onload = () => {
          const text = reader.result;
          const rows = d3.csvParse(text);
          render(rows);
        };
        reader.readAsText(file);
      }

      loadCsvButton.addEventListener("click", () => csvFileInput.click());
      csvFileInput.addEventListener("change", (event) => {
        handleCsvFile(event.target.files[0]);
      });

      d3.csv("camera_ui.csv").then((rows) => {
        render(rows);
      }).catch(() => {
        controls.style.display = "flex";
      });

      const zoom = d3.zoom()
        .scaleExtent([0.3, 3])
        .on("zoom", (event) => {
          viewport.style("transform", `translate(${event.transform.x}px, ${event.transform.y}px) scale(${event.transform.k})`);
        });

      function fitToFrame() {
        const frameNode = frame.node();
        const frameWidth = frameNode.clientWidth;
        const frameStyle = window.getComputedStyle(frameNode);
        const paddingLeft = parseFloat(frameStyle.paddingLeft) || 0;
        const paddingRight = parseFloat(frameStyle.paddingRight) || 0;
        const innerWidth = frameWidth - paddingLeft - paddingRight;
        const contentWidth = rig.node().scrollWidth;
        if (!frameWidth || !contentWidth || innerWidth <= 0) return;
        const scale = Math.min(1, innerWidth / contentWidth);
        const tx = paddingLeft + Math.max(0, (innerWidth - contentWidth * scale) / 2);
        frame.call(zoom.transform, d3.zoomIdentity.translate(tx, 0).scale(scale));
      }

      frame.call(zoom);
      window.addEventListener("resize", fitToFrame);
    </script>
  </body>
</html>
